# PlateDriver run configuration
# Pass to run_SDP.py with:  python run_SDP.py --config config.yaml

input_files:
  rotation_model: /Users/simon/GIT/octopus/Atlantis3/atlantis3_rotations.rot
  dynamic_polygons:
    - /Users/simon/GIT/octopus/Atlantis3/atlantis66_topologies.gpml
    - /Users/simon/GIT/octopus/Atlantis3/atlantis66_topological_polygons.gpml
  cratons: /Users/simon/GIT/octopus/Atlantis3/atlantis66_cratons.geojson

output_dir: ./output

run:
  reconstruction_time: 0
  delta_time: 1.0
  total_time: 60.0

forces:
  slab_pull: 6
  slab_suction: 6
  ridge_push: 3
  continental_collision: 18

params:
  raster_spacing:              0.25     # degrees; controls velocity grid resolution and polygon rasterise
  tessellation_deg:            0.2      # polygon edge densification before rasterising
  topo_simplify_tolerance:     0.4      # polygon smoothing tolerance after polygonise
  boundary_search_radius_deg:  2        # plate ID neighbour search radius at boundaries
  div_threshold_subduction:   -0.0001   # cm/yr relative normal velocity below this → subduction
  div_threshold_ridge:         0.2      # cm/yr relative normal velocity above this → ridge
  tracer_spacing_deg:          1.0      # seed point spacing along ridge boundaries
  tracer_offset_deg:           0.6      # perpendicular offset from ridge axis at seeding
  seafloor_spacing_deg:        1.0      # grid spacing for initial seafloor age tracers
  spreading_rate_km_per_myr:   50.0     # assumed spreading rate for age estimation
  csv_save_interval:           5        # save outputs every N timesteps
  plot_interval:               1        # make plots every N timesteps; set to null to disable
  eq_n_candidates:             100000   # random sphere points sampled for earthquake generation
  eq_ridge_max_dist_deg:       1.0      # max distance from ridge axis for ridge earthquakes
  eq_ridge_max_depth_km:       50.0     # max depth for ridge earthquakes (km)
  eq_slab_dip_deg:             45.0     # slab dip angle (degrees)
  eq_slab_max_depth_km:        650.0    # maximum slab depth (km)
  eq_ridge_prob:               0.15     # fraction of ridge candidates accepted (controls density)
  eq_subduction_prob:          1.0      # fraction of subduction candidates accepted
  topo_continental_base_m:     400      # background continental elevation (m)
  topo_noise_fraction:         0.3      # noise amplitude as fraction of local elevation
  topo_spectral_beta:          2.0      # SH power-law exponent (2 = brown / realistic terrain)
  topo_andean_max_dist_deg:    11.0     # cutoff distance from trench for Andean mountains
  topo_andean_arc_dist_deg:    4.5      # distance of arc-peak from trench (degrees)
  topo_andean_peak_m:          3000     # peak Andean elevation (m)
  topo_himalayan_max_dist_deg: 8.0      # half-width of Himalayan collision zone (degrees)
  topo_himalayan_peak_m:       5000     # peak Himalayan elevation (m)
  n_hotspots:                  30       # number of randomly placed hot spot sources (ignored if hotspot_locations is set)
  hotspot_prob:                1.0      # probability of eruption per hot spot per timestep
  #hotspot_locations:                 # optional: fix hotspot positions as [[lon,lat], ...]; overrides n_hotspots
  #  - [25.0, -30.0]
  #  - [-150.0, 20.0]
  #  - [12, -31]
  #  - [-5, -27]
  #  - [13, 17]
  #  - 
  slab_tracers_enabled:        true    # set true to track slab sinking and produce mantle_temp_NNNN.nc
  slab_slowing_factor:         4        # lower-mantle sinking slowdown (Lithgow-Bertelloni & Richards 1998)
  slab_max_sink_rate:          400      # km/Myr; cap on sinking rate (real Earth max ~100-200 km/Myr)
  slab_thermal_tau_myr:        4       # Myr; thermal decay timescale for slablets (lower = faster fade)
  mantle_grid_spacing_deg:     5.0     # degrees; horizontal resolution of 3D mantle temp field
  mantle_depth_interval_km:    100      # km; depth layer thickness
  cmb_heating_rate:            0.02    # heat units added per Myr everywhere (core heating)
  cmb_slab_suppression:        0.05    # heat units removed per slablet per Myr (at full coupling)
  cmb_surface_coupling:        0.1     # fractional coupling at surface (0=thermal only, 1=full instantaneous)
  cmb_sigma_deg:               10.0    # horizontal smoothing of CMB heat field (degrees)
  cmb_max_heat:                3.0     # cap on heat accumulation units
  cmb_dVs_scale:               -0.5   # dVs % per heat unit injected into 3D field (negative = warm)
  cmb_decay_km:                400.0  # Gaussian decay length upward from CMB (km)
  tomo_smooth_horiz_deg:       5.0    # tomographic blurring: horizontal Gaussian sigma (degrees; 0 = off)
  tomo_smooth_depth_km:        150.0  # tomographic blurring: vertical Gaussian sigma (km; 0 = off)
