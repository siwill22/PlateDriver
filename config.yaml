# PlateDriver run configuration
# Pass to run_SDP.py with:  python run_SDP.py --config config.yaml

input_files:
  rotation_model: examples/atlantis/atlantis3_rotations.rot
  dynamic_polygons:
    - examples/atlantis/atlantis66_topologies.gpml
    - examples/atlantis/atlantis66_topological_polygons.gpml
  continents: examples/atlantis/atlantis66_continents.geojson

output_dir: ./output

run:
  reconstruction_time: 0
  delta_time: 1.0
  total_time: 500.0          # plates shatter after about 500 Myr (README, known issues)

# Force model preset: 'physical' (the v1 force model, the default; see
# docs/force_model_v1_plan.md) or 'simple' (the original boundary-force model: fastest, and
# useful for teaching). Any component listed under force_modes overrides the preset, e.g.
#   force_modes:
#     slab_pull: slab_length   # hard | ramp | slab_length
#     slab_suction: depth_split   # ratio | depth_split
#     polarity: age            # id | age
#     ridge_push: body         # boundary | body
#     collision: breakoff      # resistance | viscous | coupling | breakoff
force_model: physical
force_modes: {}

forces:
  slab_pull: 6
  slab_suction: 6              # slab_suction: ratio — on the overriding plate
  slab_suction_deep: 3         # slab_suction: depth_split — lower-mantle slab, on both plates
  ridge_push: 3
  continental_collision: 18   # only used when force_modes.collision is resistance

params:

  # --- Numerics ---
  raster_spacing:              0.25     # degrees; controls velocity grid resolution and polygon rasterise
  tessellation_deg:            0.2      # polygon edge densification before rasterising
  topo_simplify_tolerance:     0.4      # polygon smoothing tolerance after polygonise
  boundary_search_radius_deg:  2        # plate ID neighbour search radius at boundaries
  div_threshold_subduction:   -0.0001   # km/Myr (= mm/yr) relative normal velocity below this → subduction
  div_threshold_ridge:         0.2      # km/Myr (= mm/yr) relative normal velocity above this → ridge
  tie_break:                   previous_owner   # equally near grid cells when filling plate gaps: 'previous_owner' (the cell keeps last step's plate if it is one of the tied ones, else a coin flip) or 'hash' (seeded coin flip per cell, same every step)
  tie_break_seed:              0        # seed for the tie coin flip (independent of random_seed)

  # --- Output ---
  csv_save_interval:           5        # save outputs every N timesteps
  grid_output:                 compact  # compact: grids as float32 / int32 IDs, zlib-compressed (~5x smaller); full: float64, uncompressed
  plot_interval:               null     # draw plot_NNNN.png every N timesteps (~8 s each, slower than a step); null: none (draw saved steps later with diagnose_run.py)
  random_seed:                 null     # hotspots, seamounts, earthquakes, terrain noise; null: drawn, in run_info.yaml

  # --- Seafloor & ridge tracers ---
  tracer_spacing_deg:          1.0      # seed point spacing along ridge boundaries
  tracer_offset_deg:           0.6      # perpendicular offset from ridge axis at seeding
  tracer_thin_cell_deg:        0.5      # [tracer_thinning: cell] keep one seafloor tracer per cell this size per plate
  tracer_thin_interval:        10       # [tracer_thinning: cell] thin every this many steps
  seafloor_spacing_deg:        1.0      # grid spacing for initial seafloor age tracers
  spreading_rate_km_per_myr:   50.0     # assumed spreading rate for age estimation

  # --- Seismicity ---
  eq_n_candidates:             100000   # random sphere points sampled for earthquake generation
  eq_ridge_max_dist_deg:       1.0      # max distance from ridge axis for ridge earthquakes
  eq_ridge_max_depth_km:       50.0     # max depth for ridge earthquakes (km)
  eq_slab_dip_deg:             45.0     # slab dip angle (degrees)
  eq_slab_max_depth_km:        650.0    # maximum slab depth (km)
  eq_ridge_prob:               0.15     # fraction of ridge candidates accepted (controls density)
  eq_subduction_prob:          1.0      # fraction of subduction candidates accepted

  # --- Topography ---
  topo_continental_base_m:     400      # background continental elevation (m)
  topo_noise_fraction:         0.3      # noise amplitude as fraction of local elevation
  topo_spectral_beta:          2.0      # SH power-law exponent (2 = brown / realistic terrain)
  topo_andean_max_dist_deg:    11.0     # cutoff distance from trench for Andean mountains
  topo_andean_arc_dist_deg:    4.5      # distance of arc-peak from trench (degrees)
  topo_andean_peak_m:          3000     # peak Andean elevation (m)
  topo_himalayan_max_dist_deg: 8.0      # half-width of Himalayan collision zone (degrees)
  topo_himalayan_peak_m:       5000     # peak Himalayan elevation (m)

  # --- Hotspots ---
  n_hotspots:                  30       # number of randomly placed hot spot sources (ignored if hotspot_locations is set)
  hotspot_prob:                1.0      # probability of eruption per hot spot per timestep
  #hotspot_locations:                 # optional: fix hotspot positions as [[lon,lat], ...]; overrides n_hotspots
  #  - [25.0, -30.0]
  #  - [-150.0, 20.0]
  #  - [12, -31]
  #  - [-5, -27]
  #  - [13, 17]

  # --- Slab tracers & mantle dynamics ---
  slab_tracers_enabled:        true     # set true to track slab sinking and produce mantle_temp_NNNN.nc
  slab_slowing_factor:         4        # lower-mantle sinking slowdown (Lithgow-Bertelloni & Richards 1998)
  slab_sink_rate_factor:       1.0      # upper-mantle sinking rate = factor × convergence rate (km/Myr); 10 reproduces runs before the unit fix
  slab_max_sink_rate:          400      # km/Myr; cap on sinking rate (real Earth max ~100-200 km/Myr)
  slab_thermal_tau_myr:        100      # Myr; thermal decay timescale for slablets (lower = faster fade); open for tuning (was 4: slabs vanished below ~300 km)
  mantle_grid_spacing_deg:     5.0      # degrees; horizontal resolution of 3D mantle temp field
  mantle_depth_interval_km:    100      # km; depth layer thickness
  cmb_heating_rate:            0.02     # heat units added per Myr everywhere (core heating)
  cmb_slab_suppression:        0.05     # heat units removed per (full-weight) slablet per Myr (at full coupling)
  cmb_surface_coupling:        0.1      # fractional coupling at surface (0=thermal only, 1=full instantaneous)
  cmb_sigma_deg:               10.0     # horizontal smoothing of CMB heat field (degrees, per Myr; spherical Gaussian)
  cmb_max_heat:                3.0      # cap on heat accumulation units
  cmb_dVs_scale:               -0.5     # dVs % per heat unit injected into 3D field (negative = warm)
  cmb_decay_km:                400.0    # Gaussian decay length upward from CMB (km)

  # --- Plate resistance and speed scale (force_modes.drag / speed_normalisation) ---
  continent_drag_factor:       3.0     # basal drag under continents relative to ocean (drag: area, area_edge)
  edge_drag_width_km:          3000    # boundary resistance = basal drag over a strip this wide along every boundary (area_edge)
  physics_grid_deg:            1.0     # grid for the plate area tensors (degrees)
  target_rms_speed:            50      # km/Myr (= mm/yr); area-weighted RMS plate speed after calibration
  max_rms_speed_factor:        3.0     # cap: RMS speed never exceeds this × target_rms_speed (capped steps are logged)
  speed_scale:                 null    # a number fixes the scale k (skips calibration), e.g. to compare two configs

  # --- Slab forces (force_modes.slab_pull / slab_suction / polarity) ---
  slab_ref_depth_km:           660     # slab_length: full pull once the slab reaches this depth; depth_split: suction grows from here to 2x
  slab_age_saturation_myr:     80      # slab_length: pull ∝ sqrt(min(age, this) / this), age of the seafloor arriving at the trench
  slab_search_radius_deg:      5       # slab depth at a trench = deepest slab tracer within this distance, on the overriding side
  slab_line_tol_deg:           1       # ... or up to this far on the downgoing side (slablets are seeded on the moving trench line)
  initial_slab_depth_km:       1320    # slab_length / depth_split: the step-0 trenches start with slabs this deep
  ridge_push_age_cutoff_myr:   80      # ridge_push: body — force ∝ ∇age on seafloor younger than this (none on older)
  ridge_push_smooth_deg:       0       # ridge_push: body — optional per-plate smoothing of age before the gradient (0 = off; 1.5 costs ~0.2 s/step)

  # --- Continental collision ---
  # (collision_mode now lives under force_modes.collision; params.collision_mode is still read)
  collision_coupling_max:        0.5         # [coupling, breakoff] max per-step blend fraction (0–1)
  collision_coupling_timescale:  30          # [coupling, breakoff] timesteps to ramp from zero to max
  collision_drag_factor:         10          # [viscous] drag on convergence across a continent-continent contact, × the edge drag
  breakoff_delay_myr:            10          # [breakoff] the slab of a collision detaches (stops pulling) after this long
  breakoff_contact:              viscous     # [breakoff] contact model during the collision: viscous (contact drag, scales with contact length) | coupling (velocity blending; can weld a large plate to a small contact)

  # --- Plate lifecycle (fragmentation & merging) ---
  fragmentation_enabled:       true    # split geometrically implausible plates at their neck
  min_neck_ratio:              0.35    # cut if neck half-width < this fraction of the smaller part's inscribed radius
  min_concavity_ratio:         0.85    # screening: plates with concavity below this are searched for a neck
  max_aspect_ratio:            2.0     # screening: plates with aspect ratio above this are searched for a neck
  min_child_area_deg2:         25.0    # minimum child plate area (equatorial deg², area-weighted; prevents slivers)
  min_peninsula_area_deg2:     5.0     # minimum fragment area when neck_ratio < 0.2; also the size below which a
                                       # disconnected piece of a plate is absorbed by its neighbour
  fragmentation_cooldown_myr:  5.0     # Myr before a plate can fragment again
  # --- Rifting (force_modes.rifting: trial) ---
  rift_strength_continent:     0.5      # continental strength, in full slab pull per unit length
  oceanic_strength_ratio:      3        # oceanic strength at >= 80 Myr, x continental
  oceanic_strength_floor:      0.2      # oceanic strength ~ sqrt(min(age, 80)/80), not below this
  rift_persist_myr:            3        # the cut must pass for this long before the plate splits
  rift_cooldown_myr:           10       # both halves are not tested again for this long
  rift_sweep_azimuths:         12       # candidate great circles through the plate centroid
  rift_sweep_offsets_deg:      [-15, 0, 15]   # ... each also shifted this far from the centroid
  rift_path_corridor_deg:      5        # [rift_path: least_cost] the path stays this close to the straight cut
  init_min_cells:              5        # [subduction_init] a passive-margin stretch has at least this many ocean cells
  init_boundary_gap_cells:     3        # [subduction_init] ... at least this many cells inside the plate's edge
  # --- Craton cores and belts (force_modes.continent_strength: cores) ---
  core_spacing_km:             2500     # random terranes at least this far apart, in each continent
  belt_width_km:               400      # belts between terranes, about this wide
  core_factor:                 3        # continental rift strength x this on a core
  belt_strength_factor:        0.5      # ... and x this on a belt
  core_seed:                   null     # null: random_seed
  strength_spread:             0.5      # [continent_strength: cores_random] each core / belt factor = median x exp(spread x N(0,1))
  # --- Welding and sutures (force_modes.collision_weld: on, sutures: tracers) ---
  weld_after_myr:              30       # continuous continental collision before the smaller plate is absorbed
  weld_contact_reach_deg:      1        # [collision_weld: on] continent pieces within this of the contact are welded
  weld_accrete_max_frac:       0.03     # [collision_weld_giver: downgoing] largest continent accreted to the overriding plate (share of the sphere)
  weld_accrete_min_frac:       0        # [collision_weld_giver: downgoing] smaller continent pieces are not accreted
  min_piece_area_deg2:         null     # disconnected pieces of a plate smaller than this join a neighbour (null: min_peninsula_area_deg2)
  collision_stiff_factor:      100      # [collision_contact: stiff] contact drag per collision, independent of the contact length
  collision_radius_deg:        null     # continents of two plates this close to a boundary are in collision (null: boundary_search_radius_deg)
  suture_strength_factor:      0.5      # continental rift strength x this near a suture
  suture_width_deg:            2        # ... within this great-circle distance of a suture point
  merging_enabled:             false    # absorb plates with persistently near-zero relative motion
  merge_conservative_threshold: 0.05   # km/Myr (= mm/yr); boundary |divergence| below this = near-zero
  merge_min_steps:             5        # consecutive near-zero steps before merge fires
  merge_require_no_driver:     true     # only merge if smaller plate has no ridge/subduction boundaries
  merge_cooldown_myr:          10.0     # Myr before merged plate is eligible again
  merge_max_area_frac:         null     # only absorb plates smaller than this share of the sphere (null: any size)
